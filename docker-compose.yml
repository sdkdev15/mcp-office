services:
  mcp-office:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-office
    environment:
      - OUTPUT_DIR=/app/outputs
      - FILE_RETENTION_HOURS=24
      - RATE_LIMIT_REQUESTS=50
      - RATE_LIMIT_WINDOW=60
      - MCP_TRANSPORT=sse
      - LOCALE=id_ID
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/sse')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
